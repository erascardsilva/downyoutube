Download videos -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download videos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
 

    <div class="main-container">
        <div class="card p-4">
            <div class="text-center mb-4">
                <img src="./assets/down.png" alt="DownYoutube Logo" class="app-logo">
                <h1 class="mt-3">DownYoutube</h1>
            </div>
            
            <form id="downloadForm">
                <div class="mb-3">
                    <label for="urlInput" class="form-label">URL do Vídeo</label>
                    <input type="text" class="form-control" id="urlInput" placeholder="Insira a URL do vídeo" required>
                </div>
                <div class="mb-3">
                    <label for="fileNameInput" class="form-label">Nome do Arquivo</label>
                    <input type="text" class="form-control" id="fileNameInput" placeholder="Insira o nome do arquivo" required>
                </div>
                <div class="mb-3">
                    <label for="qualitySelect" class="form-label">Qualidade do Vídeo</label>
                    <select class="form-select" id="qualitySelect" required>
                        <option value="highest">Melhor qualidade (Vídeo + Áudio)</option>
                        <option value="lowest">Menor qualidade (Vídeo + Áudio)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="downloadButton">Baixar</button>
            </form>

            <div class="progress-container mt-4">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div id="speed" class="text-center mt-2"></div>
            <div id="statusMessage" class="text-center mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
